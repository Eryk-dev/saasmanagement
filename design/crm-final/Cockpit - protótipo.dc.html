<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&amp;family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#e7ecee;color:#0c1d2b;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px}
  *{box-sizing:border-box}
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
  a{color:#0F766E;text-decoration:none}a:hover{color:#0B5D57}
  @keyframes cap-rise{from{opacity:0;transform:translateY(6px)}}
  @keyframes cap-grow{from{width:0}}
  @keyframes cap-fill{from{height:0;opacity:.3}}
  @keyframes cap-wave{to{transform:translateX(-50%)}}
  @keyframes cap-orbit{to{stroke-dashoffset:-2136.3px}}
  @keyframes cap-mark-in{from{opacity:0;transform:scale(.93)}}
  @keyframes cap-mark-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.07)}}
  @keyframes cap-splash-out{to{opacity:0}}
  @keyframes cap-grupo-in{from{opacity:0}}
  @keyframes cap-tela-in{from{opacity:0}}
  @keyframes cap-sheen{0%{background-position:0 0,0% 50%}100%{background-position:0 0,200% 50%}}
  @keyframes cap-breath{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes cap-gaveta-entra{from{opacity:0;transform:translateX(20px) scale(.985)}}
  @keyframes cap-gaveta-sai{to{opacity:0;transform:translateX(20px) scale(.985)}}
  .cap-rise{animation:cap-rise .26s cubic-bezier(.22,.61,.36,1) both}
  .cap-grow{animation:cap-grow .5s cubic-bezier(.22,.61,.36,1) both}
  .cap-fill{animation:cap-fill .6s cubic-bezier(.22,.61,.36,1) both}
  .cap-breath{animation:cap-breath 2.2s ease-in-out infinite}
  .cap-orbit{animation:cap-orbit .8s linear infinite}
  .cap-mark{animation:cap-mark-in .65s cubic-bezier(.2,.75,.25,1) both}
  .cap-splash-saindo{pointer-events:none;animation:cap-splash-out .45s ease both}
  .cap-splash-saindo .cap-mark{animation:cap-mark-out .45s cubic-bezier(.45,0,.9,.6) both}
  .cap-tela-in{animation:cap-tela-in .24s ease both}
  .cap-sheen{animation:cap-sheen 3.2s linear infinite}
  /* Ícone do trilho reage ao mouse: um passo de 1px e a cor da marca — o
     movimento diz "isto é clicável" sem mexer no texto. */
  .cap-nav{position:relative}
  .cap-nav .cap-ico{display:inline-flex;align-items:center;justify-content:center;transition:transform 160ms cubic-bezier(.22,.61,.36,1),color 160ms ease,opacity 160ms ease}
  .cap-nav:hover .cap-ico{transform:translateY(-1px) scale(1.08);color:#23D8D3;opacity:1}
  [data-mov="off"] .cap-nav .cap-ico{transition:none}
  @media (prefers-reduced-motion:reduce){.cap-nav .cap-ico{transition:none}}
  .cap-gaveta-entra{animation:cap-gaveta-entra .18s cubic-bezier(.22,.61,.36,1) both}
  .cap-gaveta-sai{animation:cap-gaveta-sai .15s cubic-bezier(.4,0,1,1) both}
  .cap-wave{position:absolute;width:200%;height:8px;left:0;top:-4px;fill:currentColor;pointer-events:none;animation:cap-wave 5s linear infinite}
  [data-mov="off"] .cap-rise,[data-mov="off"] .cap-grow,[data-mov="off"] .cap-fill,[data-mov="off"] .cap-breath,[data-mov="off"] .cap-wave,[data-mov="off"] .cap-gaveta-entra,[data-mov="off"] .cap-gaveta-sai{animation:none}
  @media (prefers-reduced-motion:reduce){.cap-rise,.cap-grow,.cap-fill,.cap-breath,.cap-wave,.cap-gaveta-entra,.cap-gaveta-sai{animation:none}}
  summary::-webkit-details-marker{display:none}
  /* Mount do dc-import: o runtime cria .sc-host como bloco de altura automática,
     então a raiz de cada tela (flex:1;min-height:0) resolvia contra o conteúdo
     e os scrollers internos nunca rolavam. */
  .sc-host{display:flex!important;flex-direction:column;flex:1 1 auto!important;min-height:0!important}
  summary::marker{content:""}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#c5cfd4;border-radius:999px;border:3px solid #e7ecee}
</style>
</helmet>

        <div style="{{ estTelaRm }}"><dc-import name="TelaRemuneracao" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaAp }}"><dc-import name="TelaAnalisePace" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaPt }}"><dc-import name="TelaAnalisePitches" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaAi }}"><dc-import name="TelaAnaliseIntegracao" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaAd }}"><dc-import name="TelaAnaliseDesempenho" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaTk }}"><dc-import name="TelaTickets" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaRr }}"><dc-import name="TelaRespostasRapidas" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaSl }}"><dc-import name="TelaConfiguracoesSLA" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaMm }}"><dc-import name="TelaMapasMentais" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
        <div style="{{ estTelaCf }}"><dc-import name="TelaConfiguracoes" hint-size="100%,100%" style="flex:1;min-height:0;display:flex;flex-direction:column"></dc-import></div>
    </div>
  </main>
</div>

<sc-if value="{{ booting }}" hint-placeholder-val="{{ true }}">
  <div class="{{ classeSplash }}" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f7f8fa">
    <svg class="cap-mark" width="64" height="70" viewBox="356 342 710 770"><circle class="cap-orbit" cx="719.19" cy="688.58" r="340" fill="none" stroke="#0F766E" stroke-opacity=".8" stroke-width="9" stroke-linecap="round" stroke-dasharray="300 1836.3"></circle><path fill="#0c1d2b" d="M519.22,843.75l-45.1,15.11c53.94,77.43,143.68,128.2,245.06,128.2,4.38,0,8.76-.08,13.07-.3l-14.13-45.02c-80.76-.3-152.75-38.68-198.9-97.98ZM719.19,390.03c-164.61,0-298.55,133.94-298.55,298.55,0,29.46,4.31,58.02,12.31,84.91l39.13-29.31c-4-17.9-6.12-36.49-6.12-55.6,0-139.6,113.62-253.22,253.22-253.22s253.15,113.62,253.15,253.22c0,99.49-57.71,185.84-141.42,227.16v49.63c109.39-44.27,186.74-151.69,186.74-276.79,0-164.61-133.86-298.55-298.47-298.55Z"></path><polygon fill="#0F766E" points="800.7 535.53 800.7 1103.92 763 983.8 749.25 939.91 691.16 754.61 501.54 817.84 457.65 832.42 362.47 864.14 443.6 803.33 481.22 775.08 800.7 535.53"></polygon></svg>
  </div>

<script type="text/x-dc" data-dc-script data-props="{&quot;movimento&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimento&quot;}}">
class Component extends DCLogic {
  // Shell do cockpit: trilho + topbar + splash (LoadingSplash do
  // components/screen-loading.jsx): marca com a órbita girando, saída de .45s
  // no boot e de .18s na troca de tela.
  static TELAS = [
    ["Vg", "Visão geral"], ["Ma", "Minhas atividades"], ["Tr", "Treinamentos"],
    ["Pi", "Pipeline"], ["Cl", "Clientes"], ["Pr", "Propostas"], ["Lp", "Links de pagamento"], ["Ct", "Contratos"], ["Fi", "Formulário de Integração"], ["Ag", "Agenda"], ["In", "Inbox"], ["Rs", "Redes sociais"], ["Pu", "Publicidade"], ["Fo", "Formulários"], ["Ca", "Canvas"], ["Di", "Disparos"], ["Bl", "Blog"], ["Ta", "Tarefas"], ["Mt", "Metas"], ["Fn", "Financeiro"], ["Ap", "Análise de Pace"], ["Pt", "Análise de Pitches"], ["Tk", "Tickets"], ["Rr", "Respostas rápidas"], ["Sl", "Configurações de SLA"], ["Ai", "Análise de Integração"], ["Ad", "Análise de Desempenho"], ["Mm", "Mapas mentais"], ["Rm", "Remuneração"], ["Cf", "Configurações"],
  ];
  // A régua de período do topo manda nas telas que são escopadas por mês (a
  // Visão geral recebe como prop, igual ao PeriodPicker do chrome.jsx).
  // PRESETS do components/period-picker.jsx (o mesmo conjunto e a mesma ordem).
  // "hoje" do protótipo é sexta, 18/09/2026; mês e semana são de calendário.
  static PRESETS = [
    { key: "today", label: "Hoje", intervalo: "18/09", mes: "set" },
    { key: "yesterday", label: "Ontem", intervalo: "17/09", mes: "set" },
    { key: "7d", label: "Últimos 7 dias", intervalo: "12/09–18/09", mes: "set" },
    { key: "14d", label: "Últimos 14 dias", intervalo: "05/09–18/09", mes: "set" },
    { key: "28d", label: "Últimos 28 dias", intervalo: "22/08–18/09", mes: "set" },
    { key: "30d", label: "Últimos 30 dias", intervalo: "20/08–18/09", mes: "set" },
    { key: "90d", label: "Últimos 90 dias", intervalo: "21/06–18/09", mes: "set" },
    { key: "week", label: "Esta semana", intervalo: "14/09–20/09", mes: "set" },
    { key: "lastWeek", label: "Semana passada", intervalo: "07/09–13/09", mes: "set" },
    { key: "month", label: "Este mês", intervalo: "01/09–30/09", mes: "set" },
    { key: "lastMonth", label: "Mês passado", intervalo: "01/08–31/08", mes: "ago" },
    { key: "julho", label: "Julho", intervalo: "01/07–31/07", mes: "jul" },
  ];
  state = { grupos: {}, tela: "Vg", booting: true, saindo: false, painel: null, lidos: false, preset: "month" };
  componentDidMount() {
    this._t1 = setTimeout(() => this.setState({ saindo: true }), 820);
    this._t2 = setTimeout(() => this.setState({ booting: false }), 1280);
    // As telas pedem navegação por evento (o shell é o dono das rotas, como o
    // app.jsx): "cobrar confirmação" na Agenda abre Minhas atividades, o card
    // de um evento abre o Pipeline.
    this._nav = (e) => { const t = e.detail && e.detail.tela; if (t) this.ir(t); };
    window.addEventListener("cockpit:ir", this._nav);
  }
  componentWillUnmount() { clearTimeout(this._t1); clearTimeout(this._t2); window.removeEventListener("cockpit:ir", this._nav); }
  // Trocar de tela é só mudar qual está visível: a tela que entra tem a própria
  // animação (cap-tela-in). O splash de 190ms entre telas já montadas vivia de
  // um timer no estado — quando dois cliques chegavam no mesmo lote o reset
  // ficava órfão e o painel opaco cobria o conteúdo por segundos.
  ir(tela) { this.setState((st) => (tela === st.tela ? { painel: null } : { tela, painel: null })); }
  alternarGrupo(id) {
    this.setState((st) => {
      const abertos = Object.assign({}, st.grupos);
      abertos[id] = !this.grupoAberto(id);
      return { grupos: abertos };
    });
  }
  // O grupo da tela aberta fica sempre expandido: recolher o que você está
  // vendo esconde onde você está.
  grupoAberto(id) {
    if (Component.GRUPO[this.state.tela] === id) return true;
    const v = (this.state.grupos || {})[id];
    return v === undefined ? false : v;
  }
  // Três níveis no trilho: os atalhos do topo (ícone, maiores), os grupos
  // (ícone, clicáveis) e os itens dentro deles (sem ícone, recuados) — o ícone
  // sai de onde ele só repetia o que o rótulo já diz.
  estNav(ativo, nivel) {
    if (nivel === "topo") {
      return "display:flex;align-items:center;gap:12px;width:100%;min-height:38px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:700;letter-spacing:.012em;text-align:left;transition:background 150ms ease,color 150ms ease;" +
        (ativo ? "background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(35,216,211,.28)"
               : "background:transparent;color:rgba(255,255,255,.82)");
    }
    return "display:flex;align-items:center;gap:11px;width:100%;min-height:32px;padding:0 12px 0 44px;border-radius:999px;font-size:12.5px;font-weight:500;letter-spacing:.012em;text-align:left;transition:background 150ms ease,color 150ms ease;" +
      (ativo ? "background:rgba(255,255,255,.1);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(35,216,211,.28)"
             : "background:transparent;color:rgba(255,255,255,.7)");
  }
  estIcone(ativo, nivel) {
    if (nivel !== "topo") return "display:none";
    return "display:inline-flex;align-items:center;justify-content:center;width:19px;flex-shrink:0;" + (ativo ? "color:#23D8D3" : "opacity:.6");
  }
  static GRUPO = {
    Tk: "Suporte", Rr: "Suporte", Sl: "Suporte",
    Pi: "Comercial", Cl: "Comercial", Pr: "Comercial", Lp: "Comercial", Ct: "Comercial", Fi: "Comercial", Ag: "Comercial", In: "Comercial",
    Rs: "Marketing", Pu: "Marketing", Fo: "Marketing", Ca: "Marketing", Di: "Marketing", Bl: "Marketing",
    Pc: "Analises", Pt: "Analises", Ai: "Analises", Ad: "Analises",
    Ta: "Geral", Mt: "Geral", Fn: "Geral", Rm: "Geral", Mm: "Geral", Cf: "Geral",
  };

  renderVals() {
    const st = this.state;
    const vals = {
      mov: this.props.movimento === false ? "off" : "on",
      booting: st.booting,
      // O preset manda: a Visão geral recebe o MÊS correspondente.
      periodo: (Component.PRESETS.find((p) => p.key === st.preset) || {}).mes || "set",
      periodoLabel: (Component.PRESETS.find((p) => p.key === st.preset) || {}).label || "",
      periodoIntervalo: (Component.PRESETS.find((p) => p.key === st.preset) || {}).intervalo || "",
      periodoAberto: st.painel === "periodo",
      abrirPeriodo: () => this.setState((s2) => ({ painel: s2.painel === "periodo" ? null : "periodo" })),
      estBotaoPeriodo: "height:32px;display:inline-flex;align-items:center;gap:9px;padding:0 6px 0 14px;border-radius:999px;font-size:12.5px;font-weight:600;transition:background 150ms ease;" +
        (st.painel === "periodo" ? "background:#e7ecee;color:#0c1d2b" : "background:#f1f4f5;color:#3d4f5c"),
      presets: Component.PRESETS.map((p) => ({
        label: p.label, intervalo: p.intervalo,
        est: "display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;height:32px;padding:0 10px;border-radius:999px;font-size:12.5px;transition:background 150ms ease;" +
          (st.preset === p.key ? "background:#E9F5F3;color:#0b6b64;font-weight:650" : "background:transparent;color:#3d4f5c;font-weight:500"),
        escolher: () => this.setState({ preset: p.key, painel: null }),
      })),
      // Selo ICP e sino: os dois viviam com cara de clicável e sem destino.
      icpAberto: st.painel === "icp", sinoAberto: st.painel === "sino",
      abrirIcp: () => this.setState((s2) => ({ painel: s2.painel === "icp" ? null : "icp" })),
      abrirSino: () => this.setState((s2) => ({ painel: s2.painel === "sino" ? null : "sino" })),
      fecharPaineis: () => this.setState({ painel: null }),
      estSino: "position:relative;width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;transition:background 150ms ease;" +
        (st.painel === "sino" ? "background:#e7ecee;color:#0c1d2b" : "background:#f1f4f5;color:#5a6b77"),
      icpCriterios: [
        "2 ou mais contas no marketplace — é o que faz a clonagem valer a pena",
        "R$ 150 mil por mês de faturamento pra cima",
        "Pelo menos 3 anúncios ativos na maior conta",
      ],
      icpNotas: [["S", "#7c3aed", "#fff"], ["A", "#16a34a", "#fff"], ["B", "#65a30d", "#fff"], ["C", "#eab308", "#463500"], ["D", "#ea580c", "#fff"], ["E", "#9aa2ad", "#fff"]]
        .map(([g, bg, fg]) => ({ g, est: "display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;background:" + bg + ";color:" + fg })),
      badgeSino: st.lidos ? "" : "3",
      estBadgeSino: st.lidos ? "display:none"
        : "position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#b42318;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff",
      sinoTitulo: st.lidos ? "Nada novo" : "3 coisas pra ver",
      rotuloLerTodos: st.lidos ? "tudo lido ✓" : "marcar todos como lidos",
      lerTodos: () => this.setState({ lidos: true }),
      avisos: st.lidos ? [] : [
        { titulo: "R$ 12.480 vencidos", nota: "Galante · Studio Kern · 3 faturas em aberto", tom: "neg", tela: "Lp" },
        { titulo: "4 leads fora do SLA", nota: "novos nunca contatados além do prazo do 1º toque", tom: "neg", tela: "Pi" },
        { titulo: "6 conversas esperando", nota: "2 janelas de 24h abertas · inbox do time", tom: "warn", tela: "In" },
      ].map((a) => ({
        titulo: a.titulo, nota: a.nota,
        cor: a.tom === "neg" ? "#b42318" : "#a16207",
        estBarra: "flex-shrink:0;width:4px;height:30px;border-radius:999px;background:" + (a.tom === "neg" ? "#b42318" : "#a16207"),
        abrir: () => this.ir(a.tela),
      })),
      classeSplash: st.saindo ? "cap-splash-saindo" : "",
      tituloTela: (Component.TELAS.find((t) => t[0] === st.tela) || ["", ""])[1],
      classeIcp: st.tela === "Vg" ? "cap-sheen" : "",
      estIcp: st.tela === "Vg"
        ? "display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 15px;border:1.5px solid transparent;border-radius:999px;color:#F3FBFF;font-size:12.5px;white-space:nowrap;background:linear-gradient(180deg,#073143,#051C2C) padding-box,linear-gradient(100deg,#0C8F83,#23D8D3 38%,#A9F5F2 50%,#23D8D3 62%,#0C8F83) border-box;background-size:100% 100%,220% 100%;box-shadow:0 0 12px rgba(35,216,211,.3)"
        : "display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 15px;border:1.5px solid rgba(35,216,211,.45);border-radius:999px;color:#F3FBFF;font-size:12.5px;white-space:nowrap;background:linear-gradient(180deg,#073143,#051C2C)",
    };
    // ── grupos do trilho: o cabeçalho expande e recolhe ────────────────
    const ALERTAS = { Comercial: 18, Suporte: 10, Marketing: 0, Analises: 0, Geral: 9 };
    for (const g of ["Comercial", "Suporte", "Marketing", "Analises", "Geral"]) {
      const aberto = this.grupoAberto(g);
      const temAtiva = Component.GRUPO[st.tela] === g;
      const n = ALERTAS[g] || 0;
      vals["abrir" + g] = () => this.alternarGrupo(g);
      vals["estGrupo" + g] = "display:flex;align-items:center;gap:12px;width:100%;min-height:38px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:700;letter-spacing:.012em;text-align:left;transition:background 150ms ease,color 150ms ease;" +
        (temAtiva ? "background:rgba(255,255,255,.08);color:#fff" : "background:transparent;color:rgba(255,255,255,.82)");
      vals["estGrupoIcone" + g] = "display:inline-flex;align-items:center;justify-content:center;width:19px;flex-shrink:0;" + (temAtiva ? "color:#23D8D3" : "opacity:.5");
      // a contagem só aparece com o grupo fechado: aberto, cada linha mostra a sua
      vals["aviso" + g] = !aberto && n ? String(n) : "";
      vals["estGrupoAviso" + g] = !aberto && n
        ? "display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 7px;border-radius:999px;background:rgba(226,105,90,.2);color:#ffb3a8;font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;font-weight:600"
        : "display:none";
      vals["estGrupoSeta" + g] = "flex-shrink:0;font-size:13px;opacity:.5;transition:transform 160ms ease;transform:rotate(" + (aberto ? "90deg" : "0deg") + ")";
      vals["estLista" + g] = aberto ? "display:flex;flex-direction:column;gap:2px;margin:1px 0 9px;animation:cap-grupo-in .18s ease both" : "display:none";
    }

    for (const [k] of Component.TELAS) {
      const ativo = st.tela === k;
      vals["ir" + k] = () => this.ir(k);
      const nivel = Component.GRUPO[k] ? "item" : "topo";
      vals["estNav" + k] = this.estNav(ativo, nivel);
      vals["estIcone" + k] = this.estIcone(ativo, nivel);
      vals["estTela" + k] = ativo
        ? "flex:1;min-height:0;display:flex;flex-direction:column;animation:cap-tela-in .24s ease both"
        : "display:none";
    }
    return vals;
  }
}
</script>
