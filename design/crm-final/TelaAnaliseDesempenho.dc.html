<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tela Análise de Desempenho</title>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..800&amp;family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#e7ecee;color:#0c1d2b;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.006em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px}
  *{box-sizing:border-box}
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
  a{color:#0F766E;text-decoration:none}a:hover{color:#0B5D57}
  @keyframes cap-rise{from{opacity:0;transform:translateY(6px)}}
  @keyframes cap-grow{from{width:0}}
  @keyframes cap-fill{from{height:0;opacity:.3}}
  @keyframes cap-wave{to{transform:translateX(-50%)}}
  @keyframes cap-breath{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes cap-gaveta-entra{from{opacity:0;transform:translateX(20px) scale(.985)}}
  @keyframes cap-gaveta-sai{to{opacity:0;transform:translateX(20px) scale(.985)}}
  .cap-rise{animation:cap-rise .26s cubic-bezier(.22,.61,.36,1) both}
  .cap-grow{animation:cap-grow .5s cubic-bezier(.22,.61,.36,1) both}
  .cap-fill{animation:cap-fill .6s cubic-bezier(.22,.61,.36,1) both}
  .cap-breath{animation:cap-breath 2.2s ease-in-out infinite}
  .cap-gaveta-entra{animation:cap-gaveta-entra .18s cubic-bezier(.22,.61,.36,1) both}
  .cap-gaveta-sai{animation:cap-gaveta-sai .15s cubic-bezier(.4,0,1,1) both}
  .cap-wave{position:absolute;width:200%;height:8px;left:0;top:-4px;fill:currentColor;pointer-events:none;animation:cap-wave 5s linear infinite}
  [data-mov="off"] .cap-rise,[data-mov="off"] .cap-grow,[data-mov="off"] .cap-fill,[data-mov="off"] .cap-breath,[data-mov="off"] .cap-wave,[data-mov="off"] .cap-gaveta-entra,[data-mov="off"] .cap-gaveta-sai{animation:none}
  @media (prefers-reduced-motion:reduce){.cap-rise,.cap-grow,.cap-fill,.cap-breath,.cap-wave,.cap-gaveta-entra,.cap-gaveta-sai{animation:none}}
  summary::-webkit-details-marker{display:none}
  summary::marker{content:""}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#c5cfd4;border-radius:999px;border:3px solid #e7ecee}
</style>
</helmet>
<div data-mov="{{ mov }}" style="flex:1;min-height:0;display:flex;flex-direction:column;background:#e7ecee;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;color:#0c1d2b;letter-spacing:-0.006em;font-variant-numeric:tabular-nums">
    <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin:0 -4px;padding:0 4px 24px">

      <header class="cap-rise" style="flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 10px 2px">
        <div style="min-width:0">
          <h1 style="margin:0;font-family:'Outfit',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.05">Análise de Desempenho</h1>
          
        </div>
        
      </header>

      <sc-for list="{{ secoes }}" as="s" hint-placeholder-count="3">
        <section class="cap-rise" style="flex:0 0 auto;overflow:hidden;background:#fff;border-radius:24px;box-shadow:0 1px 2px rgba(12,29,43,.05),0 18px 40px -26px rgba(12,29,43,.45)">
          <div style="padding:18px 20px 12px">
            <div style="display:flex;align-items:center;gap:7px">
              <span style="{{ s.estPonto }}"></span>
              <span style="font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#5a6b77">{{ s.titulo }}</span>
            </div>
            
          </div>
          <div style="overflow-x:auto">
            <div style="{{ s.estMin }}">
              <div style="{{ s.estCabec }}">
                <sc-for list="{{ s.colunas }}" as="c" hint-placeholder-count="8">
                  <span style="{{ c.est }}" title="{{ c.title }}">{{ c.label }}</span>
                </sc-for>
              </div>
              <sc-for list="{{ s.linhas }}" as="l" hint-placeholder-count="2">
                <div>
                  <button onClick="{{ l.alternar }}" style="{{ l.est }}" style-hover="background:#f7f9fa">
                    <span style="display:flex;align-items:center;gap:9px;min-width:0">
                      <span style="{{ l.estAvatar }}">{{ l.iniciais }}</span>
                      <span style="min-width:0">
                        <span style="display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.nome }}</span>
                        <span style="display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;color:#8b99a4;white-space:nowrap">{{ l.papel }}</span>
                      </span>
                    </span>
                    <sc-if value="{{ l.temRitmo }}" hint-placeholder-val="{{ true }}">
                      <span style="display:flex;align-items:flex-end;gap:2px;height:22px">
                        <sc-for list="{{ l.ritmo }}" as="b" hint-placeholder-count="7">
                          <span style="{{ b.est }}" title="{{ b.title }}"></span>
                        </sc-for>
                      </span>
                    </sc-if>
                    <sc-for list="{{ l.celulas }}" as="c" hint-placeholder-count="6">
                      <span style="{{ c.est }}">{{ c.v }}</span>
                    </sc-for>
                    <span style="{{ l.estChips }}">
                      <sc-for list="{{ l.chips }}" as="ch" hint-placeholder-count="2">
                        <span style="{{ ch.est }}" title="{{ ch.title }}">{{ ch.label }}</span>
                      </sc-for>
                      <span style="{{ l.estSemChip }}">{{ l.semChip }}</span>
                    </span>
                  </button>
                  <sc-if value="{{ l.aberta }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;flex-wrap:wrap;gap:18px;padding:4px 20px 18px;background:#f7f9fa;border-bottom:1px solid #edf1f3">
                      <sc-for list="{{ l.detalhes }}" as="d" hint-placeholder-count="4">
                        <div style="flex:1 1 210px;min-width:0">
                          <div style="font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5a6b77;margin-bottom:7px">{{ d.titulo }}</div>
                          <div style="display:flex;flex-wrap:wrap;gap:5px">
                            <sc-for list="{{ d.itens }}" as="i" hint-placeholder-count="3">
                              <button onClick="{{ i.abrir }}" style="height:24px;padding:0 10px;border-radius:999px;background:#fff;color:#3d4f5c;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(12,29,43,.06);transition:background 150ms ease" style-hover="background:#E9F5F3;color:#0b6b64">{{ i.nome }}</button>
                            </sc-for>
                            <span style="{{ d.estVazio }}">{{ d.vazio }}</span>
                          </div>
                        </div>
                      </sc-for>
                      <div style="flex:0 0 auto;align-self:flex-end">
                        <button onClick="{{ l.copiar }}" style="{{ l.estCopiar }}">{{ l.rotuloCopiar }}</button>
                      </div>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </section>
      </sc-for>
    </div>
  </div>
</x-dc>

  // ── monta uma seção ────────────────────────────────────────────────────
  secao(id, titulo, sub, cor, colunas, linhas, chave) {
    const st = this.state;
    const larg = colunas.reduce((a, c) => a + parseInt(c[2] || 90), 0) + 220;
    const grade = "minmax(186px,1.3fr) " + colunas.map((c) => c[2] || "90px").join(" ");
    return {
      titulo, sub,
      estPonto: "width:5px;height:14px;border-radius:999px;flex-shrink:0;background:" + cor,
      estMin: "min-width:" + larg + "px",
      estCabec: "display:grid;grid-template-columns:" + grade + ";gap:10px;padding:10px 20px;background:#f7f9fa;border-top:1px solid #edf1f3;border-bottom:1px solid #edf1f3",
      colunas: [["Pessoa", "", ""]].concat(colunas).map(([label, title], i) => ({
        label, title,
        est: "font-family:'Plus Jakarta Sans',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8b99a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" +
          (i === 0 || i === colunas.length ? "" : "text-align:right;") + (title ? "cursor:help" : ""),
      })),
      linhas: linhas.map((l, i) => {
        const abertaId = id + ":" + i;
        const aberta = st.aberta === abertaId;
        return Object.assign({
          nome: l.nome, papel: l.papel, iniciais: this.iniciais(l.nome),
          est: "display:grid;grid-template-columns:" + grade + ";gap:10px;padding:11px 20px;align-items:center;width:100%;text-align:left;border-bottom:1px solid #edf1f3;cursor:pointer;transition:background 150ms ease;" +
            (aberta ? "background:#f7f9fa" : ""),
          estAvatar: "flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;background:#0c1d2b;color:#fff;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700",
          aberta,
          alternar: () => this.setState({ aberta: aberta ? null : abertaId }),
          rotuloCopiar: st.copiado === abertaId ? "Relatório copiado ✓" : "Copiar relatório",
          estCopiar: "height:30px;padding:0 14px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;transition:background 150ms ease;" +
            (st.copiado === abertaId ? "background:#E9F5F3;color:#0b6b64;cursor:default" : "background:#0c1d2b;color:#fff"),
          copiar: () => {
            if (navigator.clipboard) navigator.clipboard.writeText(l.relatorio).catch(() => {});
            this.setState({ copiado: abertaId });
            clearTimeout(this._c);
            this._c = setTimeout(() => this.setState({ copiado: null }), 2200);
          },
        }, l.extra);
      }),
    };
  }

  cel(v, tom) {
    return {
      v: v == null ? "—" : String(v),
      est: "font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;text-align:right;white-space:nowrap;color:" +
        (tom === "neg" && Number(v) > 0 ? "#b42318" : tom === "pos" ? "#177a4c" : "#0c1d2b"),
    };
  }
  ritmoDe(serie) {
    if (!serie) return { temRitmo: false, ritmo: [] };
    const max = Math.max.apply(null, serie);
    const DIAS = ["sáb", "dom", "seg", "ter", "qua", "qui", "sex"];
    return {
      temRitmo: true,
      ritmo: serie.map((v, i) => ({
        title: DIAS[i] + ": " + v + (v === 1 ? " toque" : " toques"),
        est: "width:5px;border-radius:2px;height:" + Math.max(3, Math.round((v / max) * 22)) + "px;background:" +
          (i === serie.length - 1 ? "#0F766E" : "#a9d5d0"),
      })),
    };
  }
  chipsDe(objecoes) {
    if (!objecoes || !objecoes.length) return { chips: [], semChip: "sem call resumida", estSemChip: "font-size:11.5px;color:#b6c0c7", estChips: "display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0" };
    const corta = (t) => t.length > 26 ? t.slice(0, 25) + "…" : t;
    return {
      estChips: "display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0",
      estSemChip: "display:none", semChip: "",
      chips: objecoes.slice(0, 2).map(([texto, total, abertas]) => ({
        label: corta(texto) + " · " + total, title: texto + " · " + total + "× · " + abertas + " em aberto",
        est: "display:inline-flex;align-items:center;height:21px;padding:0 10px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;" +
          (abertas > 0 ? "background:#fdf3f2;color:#b42318" : "background:#f1f4f5;color:#5a6b77"),
      })).concat(objecoes.length > 2 ? [{ label: "+" + (objecoes.length - 2), title: objecoes.slice(2).map((o) => o[0]).join(" · "),
        est: "display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:999px;font-size:10.5px;color:#8b99a4;background:#f7f9fa" }] : []),
    };
  }
  detalhesDe(obj) {
    const ir = () => window.dispatchEvent(new CustomEvent("cockpit:ir", { detail: { tela: "Pi" } }));
    return Object.entries(obj).map(([titulo, itens]) => ({
      titulo,
      itens: itens.map((nome) => ({ nome, abrir: ir })),
      vazio: itens.length ? "" : "ninguém",
      estVazio: itens.length ? "display:none" : "font-size:11.5px;color:#b6c0c7",
    }));
  }
  renderVals() {
    const st = this.state;
    const jan = Component.JANELAS[st.modo];
    const i = this.idxAtual();
    const nomeJanela = jan.nomes[Math.max(0, Math.min(jan.nomes.length - 1, i))];
    const noAgora = i >= jan.nomes.length - 1;
    const sufixo = st.modo === "dia" ? "no dia" : st.modo === "semana" ? "na semana" : "no mês";

    const sdr = (Component.SDR[st.modo][i] || []).map((r) => {
      const [nome, papel, ritmo, noShow, agendadas, icp, contatos, semResp, social, viraram, obj, det] = r;
      return {
        nome, papel, relatorio: nome + " · " + nomeJanela + "\n" + contatos + " contatos · " + agendadas + " calls agendadas (" + icp + " com ICP) · " + noShow + " no-show · " + semResp + " não responderam · " + social + " social selling, " + viraram + " viraram lead.",
        extra: Object.assign({},
          this.ritmoDe(ritmo),
          this.chipsDe(obj),
          { celulas: [this.cel(noShow, "neg"), this.cel(agendadas), this.cel(icp), this.cel(contatos), this.cel(semResp, "neg"), this.cel(social), this.cel(viraram, "pos")],
            detalhes: this.detalhesDe(det) }),
      };
    });
    const social = (Component.SOCIAL[st.modo][i] || []).map((r) => {
      const [nome, papel, , feed, stories, criativos, det] = r;
      return {
        nome, papel, relatorio: nome + " · " + nomeJanela + "\n" + feed + " publicações no feed · " + stories + " stories · " + criativos + " criativos.",
        extra: Object.assign({ temRitmo: false, ritmo: [] }, this.chipsDe(null), {
          celulas: [this.cel(feed), this.cel(stories), this.cel(criativos)],
          estChips: "display:none", chips: [], semChip: "", estSemChip: "display:none",
          detalhes: this.detalhesDe(det),
        }),
      };
    });
    const closer = (Component.CLOSER[st.modo][i] || []).map((r) => {
      const [nome, papel, ritmo, noShow, realizadas, , , follow, obj, det0] = r;
      let det = det0;
      // Receita e fechamentos saem das VENDAS da janela — nunca escritos à mão.
      const vend = this.fechamentos(st.modo, i, nome);
      const receita = vend.reduce((a, v) => a + v[1], 0);
      const ticket = vend.length ? Math.round(receita / vend.length) : null;
      det = Object.assign({}, det, { Fecharam: vend.map((v) => v[0] + " · " + this.money(v[1])) });
      return {
        nome, papel, relatorio: nome + " · " + nomeJanela + "\n" + realizadas + " calls realizadas · " + this.money(receita) + " de receita" + (ticket ? " · ticket " + this.money(ticket) : "") + " · " + noShow + " no-show · " + follow + " follow-ups.",
        extra: Object.assign({},
          this.ritmoDe(ritmo),
          this.chipsDe(obj),
          { celulas: [this.cel(noShow, "neg"), this.cel(realizadas), { v: this.money(receita), est: "font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;text-align:right;white-space:nowrap;color:" + (receita > 0 ? "#177a4c" : "#8b99a4") }, this.cel(ticket == null ? null : this.money(ticket)), this.cel(follow)],
            detalhes: this.detalhesDe(det) }),
      };
    });

    return {
      mov: this.props.movimento === false ? "off" : "on",
      modos: Object.keys(Component.JANELAS).map((k) => ({
        label: Component.JANELAS[k].label, est: this.seg(st.modo === k),
        escolher: () => this.setState({ modo: k, idx: null, aberta: null }),
      })),
      janela: nomeJanela,
      anterior: () => this.setState({ idx: Math.max(0, this.idxAtual() - 1), aberta: null }),
      proximo: () => { if (!noAgora) this.setState({ idx: this.idxAtual() + 1, aberta: null }); },
      estProximo: "width:30px;height:30px;border-radius:999px;font-size:12px;box-shadow:0 1px 2px rgba(12,29,43,.05);transition:background 150ms ease;" +
        (noAgora ? "background:#f1f4f5;color:#c5cfd4;cursor:default" : "background:#fff;color:#3d4f5c"),
      secoes: [
        this.secao("sdr", "SDR", "prospecção · contatos, agenda e social selling " + sufixo, "#175cd3", [
          ["Ritmo · 7 dias", "toques por dia nos últimos 7 dias corridos", "78px"],
          ["No-show", "calls dos leads dela que não aconteceram", "76px"],
          ["Agendadas", "calls dos leads dela pela data da call", "84px"],
          ["Com ICP", "das agendadas, as com nota S/A/B", "74px"],
          ["Contatos", "leads cujo 1º contato humano na janela foi dela", "78px"],
          ["Sem resposta", "dos contatados, os sem mensagem depois do 1º toque", "92px"],
          ["Social", "registrado por ela no Meu dia", "64px"],
          ["Viraram lead", "leads com origem Social selling criados na janela", "90px"],
          ["O que ouve na call", "objeções das calls de qualificação resumidas por IA", "230px"],
        ], sdr, "sdr"),
        this.secao("social", "Mídia social", "produção da conta " + sufixo, "#5b6bd6", [
          ["Feed", "posts, carrosséis e reels publicados no @ da conta", "76px"],
          ["Stories", "stories capturados do Instagram na janela", "76px"],
          ["Criativos", "anotado por ela na tela Redes sociais", "82px"],
        ], social, "social"),
        this.secao("closer", "Closer", "fechamento · calls, receita e follow-up " + sufixo, "#0F766E", [
          ["Ritmo · 7 dias", "toques por dia nos últimos 7 dias corridos", "78px"],
          ["No-show", "calls dele na janela que não aconteceram", "76px"],
          ["Realizadas", "calls que aconteceram com ele", "86px"],
          ["Receita", "receita reconhecida na janela · conta grande fora", "96px"],
          ["Ticket médio", "receita ÷ fechamentos da janela", "94px"],
          ["Follow-ups", "toque humano em lead em Follow-up, 1 por lead por dia", "88px"],
          ["Objeções", "objeções das calls resumidas por IA na janela", "230px"],
        ], closer, "closer"),
      ],
    };
  }
}
</script>
