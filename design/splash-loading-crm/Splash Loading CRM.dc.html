<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/lever-premium-design-system-b0a067a4-25e6-4f90-a20a-2bbec221b4a2/tokens/colors.css">
<link rel="stylesheet" href="_ds/lever-premium-design-system-b0a067a4-25e6-4f90-a20a-2bbec221b4a2/tokens/layout.css">
<link rel="stylesheet" href="_ds/lever-premium-design-system-b0a067a4-25e6-4f90-a20a-2bbec221b4a2/tokens/typography.css">
<link rel="stylesheet" href="_ds/lever-premium-design-system-b0a067a4-25e6-4f90-a20a-2bbec221b4a2/styles.css">
<script src="_ds/lever-premium-design-system-b0a067a4-25e6-4f90-a20a-2bbec221b4a2/_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  a { color: var(--brand); }
  a:hover { color: var(--ink); }
  @keyframes lev-orbit { to { stroke-dashoffset: -2136.3px; } }
  @keyframes lev-in-bg { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lev-out-bg { from { opacity: 1; } to { opacity: 0; } }
  @keyframes lev-in-mark {
    from { opacity: 0; transform: scale(.93); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes lev-out-mark {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(1.07); }
  }
  @keyframes lev-in-ring { from { stroke-opacity: 0; } to { stroke-opacity: .8; } }
</style>
</helmet>
<div data-theme="{{ themeAttr }}" data-screen-label="Splash" style="min-height: 100vh; display: grid; place-items: center; background: var(--paper); font-family: var(--font-sans);">
  <sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: var(--paper); display: grid; place-items: center; animation: {{ bgAnim }};">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 24px; animation: {{ markAnim }};">
        <svg width="120" height="130" viewBox="356 342 710 770" aria-label="Carregando LeverAds" role="status" style="display: block;">
          <circle cx="719.19" cy="688.58" r="340" fill="none" stroke="var(--brand)" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round" stroke-dasharray="300 1836.3" stroke-dashoffset="0" style="animation: lev-orbit 0.8s linear infinite, lev-in-ring .7s ease-out both;"></circle>
          <path fill="var(--ink)" d="M519.22,843.75l-45.1,15.11c53.94,77.43,143.68,128.2,245.06,128.2,4.38,0,8.76-.08,13.07-.3l-14.13-45.02c-80.76-.3-152.75-38.68-198.9-97.98ZM719.19,390.03c-164.61,0-298.55,133.94-298.55,298.55,0,29.46,4.31,58.02,12.31,84.91l39.13-29.31c-4-17.9-6.12-36.49-6.12-55.6,0-139.6,113.62-253.22,253.22-253.22s253.15,113.62,253.15,253.22c0,99.49-57.71,185.84-141.42,227.16v49.63c109.39-44.27,186.74-151.69,186.74-276.79,0-164.61-133.86-298.55-298.47-298.55Z"></path>
          <polygon fill="#23D8D3" points="800.7 535.53 800.7 1103.92 763 983.8 749.25 939.91 691.16 754.61 501.54 817.84 457.65 832.42 362.47 864.14 443.6 803.33 481.22 775.08 800.7 535.53"></polygon>
        </svg>
        <sc-if value="{{ showWordmark }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink);">LeverAds</span>
        </sc-if>
        <sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12.5px; color: var(--ink); opacity: .55;">{{ status }}</div>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showWordmark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;loopDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prévia&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}">
// A tela real fica em "hold" até o app montar. O modo demo repete
// entrada → espera → saída para dar pra revisar os dois efeitos.
const PHASES = { in: 700, hold: 1600, out: 450, gap: 320 };

class Component extends DCLogic {
  state = { phase: "in" };

  componentDidMount() { this.schedule(); }
  componentWillUnmount() { clearTimeout(this.timer); }
  componentDidUpdate(prev) {
    if (prev.loopDemo !== this.props.loopDemo) {
      clearTimeout(this.timer);
      this.setState({ phase: "in" }, () => this.schedule());
    }
  }

  schedule() {
    const demo = this.props.loopDemo ?? true;
    const next = { in: demo ? "hold" : "stay", hold: "out", out: "gap", gap: "in" };
    const phase = this.state.phase;
    if (phase === "stay") return;
    this.timer = setTimeout(() => {
      this.setState({ phase: next[phase] }, () => this.schedule());
    }, PHASES[phase] || 0);
  }

  renderVals() {
    const status = (this.props.status ?? "").trim();
    const out = this.state.phase === "out";
    return {
      themeAttr: (this.props.dark ?? true) ? "dark" : "light",
      visible: this.state.phase !== "gap",
      bgAnim: out ? "lev-out-bg .45s ease both" : "lev-in-bg .5s ease both",
      markAnim: out
        ? "lev-out-mark .45s cubic-bezier(.45,0,.9,.6) both"
        : "lev-in-mark .65s cubic-bezier(.2,.75,.25,1) both",
      showWordmark: !!this.props.showWordmark,
      hasStatus: !!status,
      status,
    };
  }
}
</script>
</body>
</html>
